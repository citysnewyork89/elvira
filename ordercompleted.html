<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Order completed - Elvira Technologies</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/1JGJ5f6C/image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="assets/css/elvira-shell.css">
<style>
  main.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:48px 24px 72px;}
  .done__anim{width:240px;height:240px;border:0;background:transparent;overflow:hidden;}
  .done h1{font-size:40px;font-weight:700;margin-top:8px;}
  .done p{max-width:640px;margin-top:16px;font-size:18px;line-height:1.6;color:#2d2d2d;}
  .done p a{color:#000;font-weight:600;}
  .done .btn{margin-top:30px;background:#000;color:#fff;text-decoration:none;border-radius:8px;padding:16px 32px;font:500 18px Inter,sans-serif;}
  .done .wait p{color:#828282;}
  .spinner{width:34px;height:34px;border:3px solid #e6e6e6;border-top-color:#000;border-radius:50%;animation:spin .8s linear infinite;margin:60px auto 0;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:768px){.done h1{font-size:30px}.done p{font-size:16px}.done__anim{width:200px;height:200px}}
</style>
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo"><img src="https://i.ibb.co/yBG5pb82/image-32.png" alt="Elvira Technologies logo"></a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation"><span></span><span></span><span></span></button>
    <nav class="main-nav" id="mainNav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="store.html" class="nav-link">Store</a>
      <a href="dashboard.html#licenses" class="nav-link">Your Licences</a>
      <a href="helpcenter.html" class="nav-link">Help Center</a>
      <a href="/api/auth/discord/login" class="login-btn" id="loginBtn">Log in</a>
    </nav>
  </header>


  <main class="done" id="doneRoot"><div class="spinner"></div></main>

  <footer class="site-footer">
    <div class="footer__brand">
      <div class="footer__brand-top"><img src="https://i.ibb.co/YTDKf9D7/image.png" alt="Elvira Technologies"><span>Elvira technologies</span></div>
      <div class="footer__socials">
        <a href="https://discord.gg/4bZDmEagpH" target="_blank" rel="noopener"><img src="https://i.ibb.co/v4B5LV3s/image.png" alt="Discord"></a>
        <a href="https://www.roblox.com/es/communities/32391054/Aena-Group#!/about" target="_blank" rel="noopener"><img src="https://i.ibb.co/0pCpMZkv/image.png" alt="Roblox"></a>
      </div>
    </div>
    <div class="footer__links">
      <h4>Of Interest</h4>
      <a href="helpcenter.html">Help center</a>
      <a href="store.html">Products</a>
      <a href="dashboard.html#licenses">Your Licences</a>
    </div>
    <div class="footer__payments"><img src="https://i.ibb.co/4ZsXPvNX/image.png" alt="Accepted payment methods"></div>
  </footer>


  <script>
    // If the payment page opened this inside its frame, take over the whole window.
    if (window.top !== window.self) { try { window.top.location.replace(window.location.href); } catch (e) {} }

    var navToggle = document.getElementById('navToggle');
    var mainNav = document.getElementById('mainNav');
    navToggle.addEventListener('click', function () { mainNav.classList.toggle('open'); navToggle.classList.toggle('open'); });

    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
    var code=(new URLSearchParams(location.search).get('o')||'').toUpperCase();
    var root=document.getElementById('doneRoot');
    var tries=0;

    function clearBought(){
      try{
        var bought=JSON.parse(localStorage.getItem('elviraCheckoutLast')||'[]');
        var cart=JSON.parse(localStorage.getItem('elviraCart')||'[]').filter(function(id){return bought.indexOf(id)===-1;});
        localStorage.setItem('elviraCart',JSON.stringify(cart));
        localStorage.removeItem('elviraCheckoutLast');
        sessionStorage.removeItem('elviraCheckout');
      }catch(e){}
    }

    function showDone(){
      clearBought();
      root.innerHTML=
        '<iframe class="done__anim" title="Success animation" src="https://lottie.host/embed/92ccd309-d195-4e9b-8ddd-a05cd9e641e2/oDvUvZuIJL.lottie" loading="eager"></iframe>'+
        '<h1>Order completed successfully!</h1>'+
        '<p>Your order #'+esc(code)+' has been successfully completed. You will receive an email with your payment receipt. You will also receive a private message from the Elvire bot delivering your product. If you do not receive it, you can also download it from your licenses. (Clicking on <a href="dashboard.html#licenses">Your Licenses</a> will take you to your dashboard.)</p>'+
        '<a class="btn" href="dashboard.html#licenses">View my licenses</a>';
    }
    function showMsg(title,text,extra){
      root.innerHTML='<h1 style="margin-top:80px">'+esc(title)+'</h1><p>'+text+'</p>'+(extra||'');
    }

    function check(){
      fetch('/api/shop/order?o='+encodeURIComponent(code),{credentials:'same-origin'})
        .then(function(r){return r.json().then(function(d){return {ok:r.ok,status:r.status,d:d};});})
        .then(function(res){
          if(res.status===401){
            return showMsg('Log in to see your order','Log in with the Discord account you used to pay.','<a class="btn" href="/api/auth/discord/login?next='+encodeURIComponent('/ordercompleted.html?o='+code)+'">Log in</a>');
          }
          if(!res.ok){return showMsg('Order not found','We could not find that order on your account. If you just paid, wait a minute and refresh this page.');}
          var s=res.d.status;
          if(s==='paid') return showDone();
          // Order took too long or looks suspicious: start the purchase again.
          if(res.d.restart){ location.replace('yourorder.html'); return; }
          if(s==='error'||s==='unpaid'){ location.replace('ordererror.html?o='+encodeURIComponent(code)); return; }
          tries++;
          if(tries>60){return showMsg('Still confirming your payment','Your payment is taking longer than usual to confirm. You do not need to pay again: your product will arrive automatically as soon as it is confirmed. You can check <a href="dashboard.html#licenses">Your Licenses</a> in a few minutes.');}
          root.innerHTML='<div class="spinner"></div><h1 style="font-size:28px;margin-top:22px">Confirming your payment\u2026</h1><p>This usually takes a few seconds. Please do not close this page.</p>';
          setTimeout(check,3000);
        })
        .catch(function(){setTimeout(check,4000);});
    }

    if(!/^[A-Z2-9]{3}-[A-Z2-9]{3}-[A-Z2-9]{3}$/.test(code)){
      showMsg('Order not found','This link is not valid.');
    } else { check(); }
  </script>
  <script src="assets/js/elvira-auth.js"></script>
  <script src="assets/js/elvira-cart.js"></script>
</body>
</html>
