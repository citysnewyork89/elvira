<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product - Elvira Technologies</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/1JGJ5f6C/image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" rel="stylesheet">
<style>
  :root{
    --dark:#2D2D2D;
    --light-bg:#F7F7F7;
    --muted:#828282;
    --btn-alt:#E6E6E6;
    --radius:8px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter', sans-serif;
    color:#000;
    background:#fff;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    padding-top:146px;
  }
  img{display:block;max-width:100%;}
  a{color:inherit;}

  /* ---------- Preloader ---------- */
  #preloader{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .3s ease;}
  #preloader img{width:78px;opacity:0;transform:scale(.9);animation:logoIn .7s ease forwards;}
  @keyframes logoIn{to{opacity:1;transform:scale(1);}}
  #preloader.hidden{opacity:0;pointer-events:none;}
  .slow-msg{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);font-size:13px;color:#828282;text-align:center;white-space:nowrap;opacity:0;transition:opacity .4s ease;}
  .slow-msg.visible{opacity:1;}

  /* ---------- Page transition ---------- */
  #pageTransition{position:fixed;inset:0;background:#fff;z-index:10000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s ease;}
  #pageTransition.visible{opacity:1;pointer-events:auto;}
  .pt-loader{width:96px;height:96px;}
  .pt-loader svg{width:100%;height:100%;}

  /* ---------- Header ---------- */
  header.site-header{width:100%;height:146px;background:var(--dark);display:flex;align-items:center;justify-content:space-between;padding:0 56px;position:fixed;top:0;left:0;z-index:20;}
  .site-header .logo img{height:44px;width:auto;}
  nav.main-nav{display:flex;align-items:center;gap:36px;}
  nav.main-nav a.nav-link{color:#fff;font-size:20px;font-weight:500;text-decoration:none;white-space:nowrap;transition:opacity .25s ease;}
  nav.main-nav a.nav-link:hover{opacity:.7;}
  a.login-btn{background:#fff;color:#000;font-size:16px;font-weight:400;text-decoration:none;padding:10px 22px;border-radius:var(--radius);transition:transform .2s ease, opacity .2s ease;margin-left:8px;}
  a.login-btn:hover{opacity:.85;}
  .nav-toggle{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:8px;}
  .nav-toggle span{width:26px;height:2px;background:#fff;display:block;transition:transform .3s ease, opacity .3s ease;}
  .nav-toggle.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
  .nav-toggle.open span:nth-child(2){opacity:0;}
  .nav-toggle.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

  /* ---------- User menu ---------- */
  .user-menu{position:relative;margin-left:8px;}
  .user-menu__trigger{display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:999px;font-family:'Inter', sans-serif;transition:background .2s ease;}
  .user-menu__trigger:hover{background:rgba(255,255,255,.1);}
  .user-menu__avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#828282;flex-shrink:0;}
  .user-menu__name{color:#fff;font-size:16px;font-weight:500;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .user-menu__chevron{color:#fff;font-size:20px;transition:transform .25s ease;}
  .user-menu__trigger.open .user-menu__chevron{transform:rotate(180deg);}
  .user-menu__dropdown{position:absolute;top:calc(100% + 10px);right:0;background:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:200px;padding:8px;opacity:0;pointer-events:none;transform:translateY(-6px);transition:opacity .2s ease, transform .2s ease;z-index:40;}
  .user-menu__dropdown.open{opacity:1;pointer-events:auto;transform:translateY(0);}
  .user-menu__dropdown a,.user-menu__dropdown button{display:block;width:100%;text-align:left;background:none;border:none;font-family:'Inter', sans-serif;font-size:15px;font-weight:500;color:#000;text-decoration:none;padding:10px 12px;border-radius:6px;cursor:pointer;}
  .user-menu__dropdown a:hover,.user-menu__dropdown button:hover{background:#F7F7F7;}

  /* ---------- Product ---------- */
  .product-page{max-width:1260px;margin:0 auto;padding:56px;display:grid;grid-template-columns:1.1fr 1fr;gap:56px;}
  .product-gallery__main{width:100%;height:420px;border-radius:12px;overflow:hidden;background:var(--light-bg);}
  .product-gallery__main img,.product-gallery__main video{width:100%;height:100%;object-fit:cover;}
  .product-gallery__thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .product-gallery__thumbs button{width:72px;height:72px;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:var(--light-bg);}
  .product-gallery__thumbs button.active{border-color:#000;}
  .product-gallery__thumbs img{width:100%;height:100%;object-fit:cover;}

  .product-info__label{display:inline-block;background:#000;color:#fff;font-size:13px;font-weight:500;padding:5px 12px;border-radius:999px;margin-bottom:14px;}
  .product-info__category{font-size:14px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
  .product-info h1{font-size:40px;font-weight:600;color:#000;line-height:1.15;}
  .product-info__price{margin-top:18px;font-size:32px;font-weight:700;color:#000;}
  .product-info__price .original{text-decoration:line-through;color:#828282;font-weight:500;font-size:22px;margin-right:10px;}
  .product-info__badge{display:inline-block;margin-left:10px;background:#c0392b;color:#fff;font-size:14px;font-weight:600;padding:4px 10px;border-radius:999px;vertical-align:middle;}
  .product-info__notice{margin-top:16px;background:#FFF3CD;color:#7a5b00;font-size:14px;font-weight:500;padding:10px 14px;border-radius:8px;}
  .product-info__actions{margin-top:28px;display:flex;gap:12px;}
  .btn-buy{flex:1;background:#000;color:#fff;text-align:center;padding:16px 0;border-radius:var(--radius);text-decoration:none;font-size:18px;font-weight:500;border:none;cursor:pointer;}
  .btn-cart-large{width:56px;height:56px;background:var(--btn-alt);border:none;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .btn-cart-large img{width:24px;height:24px;}
  .product-info__desc{margin-top:32px;font-size:17px;line-height:1.65;color:#1c1c1c;}
  .product-info__desc p{margin-bottom:14px;}
  .product-info__extra{margin-top:24px;padding-top:24px;border-top:1px solid #E6E6E6;font-size:15px;line-height:1.6;color:#454545;white-space:pre-line;}

  .product-loading,.product-error{max-width:1260px;margin:0 auto;padding:120px 56px;text-align:center;font-size:20px;color:var(--muted);}

  /* ---------- Footer ---------- */
  footer.site-footer{width:100%;min-height:264px;background:#fff;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:40px;padding:44px 56px;}
  .footer__brand{display:flex;flex-direction:column;justify-content:space-between;min-height:170px;}
  .footer__brand-top{display:flex;align-items:center;gap:12px;}
  .footer__brand-top img{width:44px;height:43px;}
  .footer__brand-top span{font-size:24px;font-weight:400;color:#000;}
  .footer__socials{display:flex;gap:14px;margin-top:32px;}
  .footer__socials a img{width:32px;height:32px;transition:opacity .2s ease;}
  .footer__socials a:hover img{opacity:.7;}
  .footer__links h4{font-size:16px;font-weight:500;color:#000;margin-bottom:14px;}
  .footer__links a{display:block;font-size:16px;font-weight:400;color:#000;text-decoration:none;margin-bottom:10px;transition:opacity .2s ease;}
  .footer__links a:hover{opacity:.6;}
  .footer__payments{align-self:flex-end;}
  .footer__payments img{max-width:180px;}

  #scrollTop{position:fixed;right:28px;bottom:32px;width:52px;height:52px;border:none;border-radius:50%;background:var(--dark);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .3s ease, transform .3s ease;z-index:50;}
  #scrollTop.visible{opacity:1;pointer-events:auto;transform:translateY(0);}
  #scrollTop .material-symbols-outlined{font-size:26px;line-height:1;}

  @media (max-width:900px){
    .product-page{grid-template-columns:1fr;padding:40px 24px;gap:32px;}
    .product-gallery__main{height:300px;}
  }
  @media (max-width:768px){
    body{padding-top:88px;}
    header.site-header{padding:0 24px;height:88px;}
    .site-header .logo img{height:34px;}
    .nav-toggle{display:flex;}
    nav.main-nav{position:absolute;top:88px;left:0;width:100%;background:var(--dark);flex-direction:column;align-items:flex-start;gap:0;max-height:0;padding:0 24px;overflow:hidden;transition:max-height .35s ease, padding .35s ease;}
    nav.main-nav.open{max-height:400px;padding:12px 24px 20px;}
    nav.main-nav a.nav-link{padding:12px 0;width:100%;}
    a.login-btn{margin:12px 0 0;}
    .user-menu{margin:12px 0 0;width:100%;}
    .user-menu__trigger{width:100%;justify-content:space-between;}
    .user-menu__dropdown{position:static;box-shadow:none;border:1px solid #eee;margin-top:8px;opacity:1;pointer-events:auto;transform:none;display:none;padding:8px;}
    .user-menu__dropdown.open{display:block;}
    .product-info h1{font-size:28px;}
    .product-info__price{font-size:26px;}
    footer.site-footer{padding:36px 24px;}
    .footer__payments{align-self:flex-start;}
  }
</style>
</head>

  <script>
    function formatEuro(n) { return '€' + (Math.round(n * 100) / 100).toFixed(2); }

    var params = new URLSearchParams(window.location.search);
    var productId = params.get('id') || '';

    function renderMedia(media, index) {
      var main = document.getElementById('galleryMain');
      var item = media[index];
      if (!item) { main.innerHTML = ''; return; }
      main.innerHTML =
        item.type === 'video'
          ? '<video src="' + item.url + '" controls playsinline></video>'
          : '<img src="' + item.url + '" alt="">';
    }

    function renderProduct(product) {
      document.title = product.name + ' - Elvira Technologies';
      document.getElementById('productLoading').style.display = 'none';
      document.getElementById('productPage').style.display = 'grid';

      document.getElementById('productCategory').textContent = product.category || '';
      document.getElementById('productName').textContent = product.name;

      var priceEl = document.getElementById('productPrice');
      var priceHtml = product.price.hasDiscount
        ? '<span class="original">' + formatEuro(product.price.original) + '</span>' + formatEuro(product.price.final)
        : formatEuro(product.price.original);
      if (product.label) priceHtml = '<div class="product-info__label">' + product.label + '</div><br>' + priceHtml;
      if (product.price.hasDiscount) priceHtml += '<span class="product-info__badge">' + product.price.badge + '</span>';
      priceEl.innerHTML = priceHtml;

      var notice = document.getElementById('productNotice');
      if (product.isPrivatePreview) {
        notice.innerHTML = '<div class="product-info__notice">This product is private. Only admins and staff can see this preview.</div>';
      } else if (product.isUnlisted) {
        notice.innerHTML = '<div class="product-info__notice">This product is unlisted — it only shows up to people with the direct link.</div>';
      }

      document.getElementById('productDescription').innerHTML = product.descriptionHtml || '<p>No description provided.</p>';

      if (product.extraDetails) {
        var extra = document.getElementById('productExtra');
        extra.style.display = 'block';
        extra.textContent = product.extraDetails;
      }

      var media = product.media && product.media.length ? product.media : [{ type: 'image', url: 'https://i.ibb.co/v4Fk3Cjf/image.png' }];
      renderMedia(media, 0);
      var thumbs = document.getElementById('galleryThumbs');
      if (media.length > 1) {
        media.forEach(function (item, i) {
          var btn = document.createElement('button');
          btn.type = 'button';
          if (i === 0) btn.className = 'active';
          btn.innerHTML = item.type === 'video'
            ? '<img src="https://i.ibb.co/v4Fk3Cjf/image.png" alt="">'
            : '<img src="' + item.url + '" alt="">';
          btn.addEventListener('click', function () {
            renderMedia(media, i);
            thumbs.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
          });
          thumbs.appendChild(btn);
        });
      }

      var cartBtn = document.getElementById('cartBtn');
      function syncCartBtn() {
        var inCart = window.ElviraCart && window.ElviraCart.has(product.id);
        cartBtn.style.background = inCart ? '#c9c9c9' : '';
        cartBtn.setAttribute('aria-label', inCart ? 'Added to cart' : 'Add to cart');
      }
      cartBtn.addEventListener('click', function () {
        if (window.ElviraCart) window.ElviraCart.add(product.id);
        syncCartBtn();
      });
      document.addEventListener('elvira:cart', syncCartBtn);
      window.addEventListener('load', syncCartBtn);
      document.getElementById('buyBtn').addEventListener('click', function () {
        if (window.ElviraCart) window.ElviraCart.buy(product.id);
      });
    }

    if (!productId) {
      document.getElementById('productLoading').style.display = 'none';
      document.getElementById('productError').style.display = 'block';
    } else {
      fetch('/api/public/product?id=' + encodeURIComponent(productId), { credentials: 'same-origin' })
        .then(function (r) { if (!r.ok) throw new Error('not found'); return r.json(); })
        .then(function (data) { renderProduct(data.product); })
        .catch(function () {
          document.getElementById('productLoading').style.display = 'none';
          document.getElementById('productError').style.display = 'block';
        });
    }

    /* ---------- Preloader ---------- */
    var preloader = document.getElementById('preloader');
    var slowMsg = document.getElementById('slowMsg');
    var pageStart = Date.now();
    function hidePreloader() {
      preloader.classList.add('hidden');
      setTimeout(function () { preloader.style.display = 'none'; }, 300);
    }
    window.addEventListener('load', function () {
      var elapsed = Date.now() - pageStart;
      setTimeout(hidePreloader, Math.max(1200 - elapsed, 0));
    });
    setTimeout(function () {
      if (!preloader.classList.contains('hidden')) slowMsg.classList.add('visible');
    }, 7000);

    /* ---------- Mobile nav ---------- */
    var navToggle = document.getElementById('navToggle');
    var mainNav = document.getElementById('mainNav');
    navToggle.addEventListener('click', function () {
      mainNav.classList.toggle('open');
      navToggle.classList.toggle('open');
    });

    /* ---------- Scroll to top ---------- */
    var scrollBtn = document.getElementById('scrollTop');
    window.addEventListener('scroll', function () {
      if (window.scrollY > 400) scrollBtn.classList.add('visible');
      else scrollBtn.classList.remove('visible');
    });
    scrollBtn.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    /* ---------- Page transition ---------- */
    var pageTransition = document.getElementById('pageTransition');
    document.querySelectorAll('a[href]').forEach(function (link) {
      var href = link.getAttribute('href');
      if (!href || href.startsWith('#') || link.target === '_blank' || /^https?:\/\//i.test(href)) return;
      link.addEventListener('click', function (e) {
        e.preventDefault();
        pageTransition.classList.add('visible');
        sessionStorage.setItem('elviraInternalNav', '1');
        setTimeout(function () { window.location.href = href; }, 450);
      });
    });
  </script>

  <script src="assets/js/elvira-auth.js"></script>
  <script src="assets/js/elvira-cart.js"></script>

</body>
</html>
